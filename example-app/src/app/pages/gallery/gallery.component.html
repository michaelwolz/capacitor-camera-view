<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gallery</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="clearGallery()"
        fill="clear"
        color="danger"
        [disabled]="!galleryService.items().length"
      >
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @let items = galleryService.items();

  @if (items.length) {
    <ion-grid>
      <ion-row>
        @for (item of items; track $index) {
          <ion-col size="6">
            <ion-card>
              @if (item.type === "photo") {
                <ion-img [src]="item.data" alt="Captured photo"></ion-img>
              } @else if (item.type === "video") {
                <video controls playsinline width="100%">
                  <source [src]="item.data" type="video/mp4" />
                </video>
              }
            </ion-card>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  } @else {
    <div class="empty-state ion-padding ion-text-center">
      <ion-icon
        name="images-outline"
        size="large"
        color="medium"
        aria-hidden="true"
      ></ion-icon>
      <ion-text color="medium">
        <p>No captures yet. Photos and videos will show up here.</p>
      </ion-text>
    </div>
  }
</ion-content>
